appId: com.jsnassistent.app
name: Rakazo mobile Dutch
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

- extendedWaitUntil:
    visible: "Sign up for Rakazo"
    timeout: 30000
- tapOn: "Sign in"
- runFlow: helpers/server.yaml

- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true

- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000

# Account -> Taal -> Nederlands
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Language"
    timeout: 15000
- takeScreenshot: "10-account-en"
- tapOn: "Language"
- extendedWaitUntil:
    visible: "Nederlands"
    timeout: 15000
- takeScreenshot: "11-taal-keuze-en"
- scrollUntilVisible:
    element: "Nederlands"
    direction: DOWN
    timeout: 15000
- tapOn: "Nederlands"
- extendedWaitUntil:
    visible: "Taal"
    timeout: 15000
- takeScreenshot: "12-taal-nederlands"
- back
- extendedWaitUntil:
    visible: "Taal"
    timeout: 15000
- takeScreenshot: "13-account-nl"
